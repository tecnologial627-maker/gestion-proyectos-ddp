<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gestión de Proyectos DDP</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f4f6f9;--card:#fff;--tx:#1b2433;--mu:#667085;--bd:#e3e7ee;--pr:#1d4ed8;--prt:#fff;--ok:#15803d;--okb:#dcfce7;--ex:#1d4ed8;--exb:#dbeafe;--pe:#b45309;--peb:#fef3c7;--su:#b91c1c;--sub:#fee2e2;--bar:#e5e9f0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#0f141c;--card:#18202c;--tx:#e8edf5;--mu:#98a2b3;--bd:#2a3445;--pr:#5b8cff;--prt:#0b1020;--ok:#4ade80;--okb:#12341f;--ex:#7aa2ff;--exb:#172a52;--pe:#fbbf24;--peb:#3a2c0b;--su:#f87171;--sub:#3b1616;--bar:#2a3445;color-scheme:dark}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
.w{max-width:1380px;margin:0 auto;padding:18px 14px 40px}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:16px}
h1{font-size:21px;margin:0}header p{margin:2px 0 0;color:var(--mu);font-size:13px}
button,select,input,textarea{font:inherit;color:var(--tx)}:focus-visible{outline:2px solid var(--pr);outline-offset:2px}
.b{display:inline-flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 13px;cursor:pointer;font-weight:600}
.b.p{background:var(--pr);color:var(--prt);border-color:var(--pr)}.b:hover{filter:brightness(.96)}.b:disabled{opacity:.4;cursor:default}
.b.ap{background:#16a34a;color:#fff;border-color:#16a34a}.b.ap:hover{background:#15803d}
.b.danger{background:var(--sub);color:var(--su);border-color:var(--su)}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px}
.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:14px}
.kc{display:flex;gap:12px;align-items:center}.ki{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--exb);color:var(--ex);flex:none}
.kc:nth-child(3) .ki{background:var(--okb);color:var(--ok)}.kc:nth-child(4) .ki{background:var(--peb);color:var(--pe)}.kc:nth-child(5) .ki{background:var(--sub);color:var(--su)}
.kt small{color:var(--mu);font-size:12px;display:block}.kv{display:block;font-size:21px;line-height:1.2}
.f{display:grid;grid-template-columns:2fr repeat(5,1fr) auto;gap:8px;margin-bottom:14px}
.f input,.f select,dialog input,dialog select,dialog textarea{width:100%;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:9px 10px}
.sb{position:relative}.sb span{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--mu);display:flex}.sb input{padding-left:38px}
.hd{display:flex;gap:12px;align-items:center}.lg{width:46px;height:46px;border-radius:13px;background:var(--pr);color:var(--prt);display:flex;align-items:center;justify-content:center}
#sy{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border:1px solid var(--bd);border-radius:99px;background:var(--card);font-size:12px;color:var(--mu)}.dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}.dot.x{background:var(--su)}
.dm{position:relative}.dm summary{list-style:none}.dm summary::-webkit-details-marker{display:none}
.mn{position:absolute;right:0;top:44px;z-index:20;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:6px;min-width:230px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.mn button{display:flex;gap:8px;align-items:center;width:100%;background:none;border:0;padding:9px 10px;border-radius:8px;cursor:pointer;text-align:left}.mn button:hover{background:var(--bg)}.mn .dg{color:var(--su)}
.tb{overflow-x:auto}.tb h3,.dn h3{margin:0 0 10px;font-size:14px}table{width:100%;border-collapse:collapse;min-width:1100px}
th{text-align:left;font-size:12px;color:var(--mu);padding:6px 8px;border-bottom:1px solid var(--bd);cursor:pointer;white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--bd);vertical-align:middle}td small{color:var(--mu);display:block}tbody tr:hover{background:var(--bg)}
.lk{background:none;border:0;padding:0;font-weight:700;cursor:pointer;text-align:left;color:var(--tx)}.lk:hover{color:var(--pr)}
.s{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.s.Finalizado{background:var(--okb);color:var(--ok)}.s.Enejecución{background:var(--exb);color:var(--ex)}.s.Planificación{background:var(--peb);color:var(--pe)}.s.Suspendido{background:var(--sub);color:var(--su)}
.tp{display:inline-block;padding:2px 8px;border-radius:6px;background:var(--bg);border:1px solid var(--bd);font-size:12px;white-space:nowrap}
.z{font-weight:700;font-size:11px}.z.at{color:var(--su)}.z.pv{color:var(--pe)}.z.ok{color:var(--ok)}
.bar{height:6px;background:var(--bar);border-radius:5px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--pr)}.bar.f2 i{background:var(--ok)}
.ic{display:inline-flex;width:32px;height:32px;align-items:center;justify-content:center;border-radius:8px;color:var(--mu);padding:0;background:none;border:0;cursor:pointer}.ic:hover{background:var(--bg);color:var(--pr)}.ic[data-d]:hover{color:var(--su);background:var(--sub)}
.e{text-align:center;color:var(--mu);padding:28px}
.dn{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-bottom:14px}.dw{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.lz{flex:1;min-width:150px}
.lr{display:flex;align-items:center;gap:8px;font-size:12px;padding:4px 6px;border-radius:6px}.lr[data-p],.lr[data-t]{cursor:pointer}.lr:hover{background:var(--bg)}.lr i{width:10px;height:10px;border-radius:3px;flex:none}.lr span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pg{display:flex;justify-content:center;align-items:center;gap:12px;padding:12px;font-size:13px;color:var(--mu)}
.ts{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:#111827;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:99;max-width:90vw;display:flex;gap:12px;align-items:center}.ts.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}.ts.er{background:#b91c1c}.ts button{background:none;border:0;color:#93c5fd;font-weight:700;cursor:pointer}
#ld{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:999}#ld div{background:var(--card);padding:22px 30px;border-radius:14px;text-align:center}
dialog{border:1px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);width:min(600px,94vw);max-height:92vh;overflow:auto;padding:18px}dialog::backdrop{background:rgba(0,0,0,.5)}
dialog label{display:block;font-size:12px;color:var(--mu);margin:10px 0 3px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ft{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.dl{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin:12px 0}.dl small{color:var(--mu);display:block;font-size:12px}
.hi{list-style:none;margin:8px 0 0;padding:0;border-left:2px solid var(--bd)}.hi li{padding:4px 0 8px 12px;font-size:13px}.hi small{color:var(--mu);display:block}
@media(max-width:900px){.f{grid-template-columns:1fr 1fr}.sb{grid-column:1/-1}}
@media print{header>div:last-child,.f,.pg,.ic,.ts,th:last-child,td:last-child{display:none!important}body{background:#fff}.dn{grid-template-columns:repeat(3,1fr)}table{min-width:0;font-size:11px}}
</style>
</head>
<body>
<div id="ld"><div><b>Procesando archivo…</b></div></div>
<div class="w">
<header>
 <div class="hd"><span class="lg" data-i="building"></span><div><h1>Gestión de Proyectos</h1><p>Portafolio institucional de obras y desarrollo provincial · República Dominicana</p></div></div>
 <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
  <span id="sy"></span>
  <button class="b ap" id="btnApply" data-i="save">Aplicar cambios</button>
  <details class="dm" id="dm"><summary class="b">Datos ▾</summary><div class="mn">
   <button id="im" data-i="upload">Importar Excel</button>
   <button id="xp" data-i="download">Exportar Excel</button>
   <button id="bk" data-i="save">Descargar respaldo (JSON)</button>
   <button id="rs" data-i="upload">Restaurar respaldo</button>
   <button id="pr" data-i="folder">Imprimir informe</button>
   <button id="da" class="dg" data-i="trash">Borrar todo el portafolio</button>
  </div></details>
  <button class="b p" id="nw" data-i="plus">Nuevo proyecto</button>
 </div>
</header>
<input type="file" id="fi" accept=".xlsx,.xls,.csv" hidden><input type="file" id="fj" accept=".json" hidden>
<section class="k" id="k"></section>
<section class="f">
 <div class="sb"><span data-i="search"></span><input id="q" type="search" placeholder="Buscar proyecto, código, supervisor o contratista…"></div>
 <select id="fr"></select><select id="fp"></select><select id="ftp"></select><select id="fs"></select><select id="fz"></select>
 <button class="b" id="cl">Limpiar</button>
</section>
<section class="dn" id="dn"></section>
<section><div class="c tb"><h3 id="ct"></h3><table><thead><tr id="th"></tr></thead><tbody id="tb"></tbody></table><div id="pg" class="pg"></div></div></section>
<p style="color:var(--mu);font-size:12px;margin-top:14px">Los datos se guardan automáticamente en este navegador. Descarga un respaldo (menú Datos) para compartirlos o protegerlos.</p>
</div>
<div id="ts" class="ts" role="status"></div>

<dialog id="dg"><form id="fm" style="margin:0">
 <h3 id="dt" style="margin:0 0 4px">Proyecto</h3>
 <label>Nombre del proyecto *</label><input id="n" required>
 <div class="g2"><div><label>Provincia *</label><select id="p" required></select></div><div><label>Código SNIP</label><input id="c"></div></div>
 <div class="g2"><div><label>Tipo de obra</label><select id="t"></select></div><div><label>Ubicación</label><input id="u"></div></div>
 <div class="g2"><div><label>Presupuesto (RD$) *</label><input id="b" type="number" min="0" step="any" required></div><div><label>Monto ejecutado (RD$)</label><input id="ej" type="number" min="0" step="any"></div></div>
 <div class="g2"><div><label>Estatus</label><select id="s"></select></div><div><label>Contratista</label><input id="ct2"></div></div>
 <div class="g2"><div><label>Fecha de inicio</label><input id="di" type="date"></div><div><label>Duración estimada (días)</label><input id="du" type="number" min="0" step="1"></div></div>
 <label>Supervisor</label><input id="sv" list="svl" autocomplete="off"><datalist id="svl"></datalist>
 <label>Observación</label><input id="ob">
 <label>Avance físico: <b id="av">0%</b></label><input id="a" type="range" min="0" max="100" step="5" value="0">
 <div class="ft"><button type="button" class="b" id="ca">Cancelar</button><button type="submit" class="b p">Guardar proyecto</button></div>
</form></dialog>
<dialog id="dv"><div id="dvb"></div></dialog>

<script>
const REG={"Gran Santo Domingo":["Distrito Nacional","Santo Domingo","Santo Domingo Este","Santo Domingo Oeste","Santo Domingo Norte"],
"Norte (Cibao)":["Santiago","Puerto Plata","La Vega","Espaillat","Duarte","Hermanas Mirabal","María Trinidad Sánchez","Samaná","Monseñor Nouel","Sánchez Ramírez","Valverde","Monte Cristi","Santiago Rodríguez","Dajabón"],
"Este":["La Altagracia","La Romana","San Pedro de Macorís","Hato Mayor","El Seibo","Monte Plata"],
"Sur":["Azua","San Juan","Barahona","Bahoruco","Independencia","Pedernales","Peravia","San Cristóbal","San José de Ocoa","Elías Piña"],
"Sin región":["Sin asignar"]};
const ST=["Planificación","En ejecución","Finalizado","Suspendido"],R2={};
const TP=["Seguridad ciudadana","Deportiva","Eléctrica","Vial","Comunitaria","Educativa","Salud","Agua y saneamiento","Comercial","Emergencias","Otra"];
const CT=["#1d4ed8","#0891b2","#16a34a","#d97706","#7c3aed","#dc2626","#db2777","#0d9488","#65a30d","#ea580c","#94a3b8"];
Object.keys(REG).forEach(r=>REG[r].forEach(p=>R2[p]=r));
const $=i=>document.getElementById(i);
const nz=s=>String(s==null?"":s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim().toLowerCase();
const PL={};Object.values(REG).flat().forEach(p=>PL[nz(p)]=p);
Object.assign(PL,{"azua de compostela":"Azua","san juan de la maguana":"San Juan","salcedo":"Hermanas Mirabal","montecristi":"Monte Cristi","higuey":"La Altagracia","santiago de los caballeros":"Santiago"});
const PK=Object.keys(PL).sort((a,b)=>b.length-a.length);
function cleanProv(s){const t=nz(s).replace(/^provincia\s*:?\s*/,"");if(PL[t])return PL[t];const k=PK.find(k=>t.indexOf(k)>-1);return k?PL[k]:"Sin asignar"}
const TR=[[/DESTACAMENTO|POLIC|CUARTEL/,0],[/BOMBERO/,9],[/DEPORT|CANCHA|ESTADIO|CLUB|BEISBOL/,1],[/PUENTE|CARRETERA|CALLE|CAMINO|VIAL|ASFALT|AVENIDA|ACERA/,3],[/ELECTR|ALUMBRADO|LUMINARIA|SUBESTACION/,2],[/ESCUELA|LICEO|COLEGIO|AULA|ESTANCIA/,5],[/HOSPITAL|CLINICA|SALUD|DISPENSARIO/,6],[/ACUEDUCTO|AGUA|ALCANTARILL|DRENAJE|CANADA|POZO/,7],[/MERCADO|PLAZA|COMERCIAL/,8],[/FUNERARIA|COMUNAL|IGLESIA|CAPILLA|PARQUE|MULTIUSO/,4]];
const inf=n=>{const u=nz(n).toUpperCase(),r=TR.find(r=>r[0].test(u));return r?TP[r[1]]:"Otra"};

const KEY="gp_proyectos_v19",OLD="gp_proyectos_v18_master";
let P=[],F={q:"",r:"",p:"",t:"",s:"",z:""},sk="n",sd=1,ed=null,PG=1,PS=25,SG="",LS=null,ERR=false,UN=null;
const IC={plus:'<path d="M5 12h14M12 5v14"/>',upload:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>',download:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>',search:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',edit:'<path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/>',trash:'<path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',folder:'<path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>',cash:'<rect width="20" height="12" x="2" y="6" rx="2"/><circle cx="12" cy="12" r="2"/>',activity:'<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>',clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',building:'<rect width="16" height="20" x="4" y="2" rx="2"/><path d="M9 22v-4h6v4M8 6h.01M16 6h.01M12 6h.01M12 10h.01M12 14h.01M16 10h.01M16 14h.01M8 10h.01M8 14h.01"/>',save:'<path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/>'};
const I=n=>'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+IC[n]+'</svg>';
const hoy=()=>{const d=new Date();return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)};
const dif=(a,b)=>Math.round((new Date(b+"T00:00:00Z")-new Date(a+"T00:00:00Z"))/864e5);
const fdt=s=>s?s.split("-").reverse().join("/"):"—";
const fd=d=>d<30?d+" días":(d/30.4).toFixed(1).replace(".0","")+" meses";
const fh=m=>new Date(m).toLocaleString("es-DO",{dateStyle:"medium",timeStyle:"short"});
const rd=n=>"RD$ "+Math.round(n).toLocaleString("es-DO");
const esc=t=>String(t==null?"":t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const opts=(a,f)=>(f?'<option value="">'+f+'</option>':"")+a.map(x=>'<option>'+esc(x)+'</option>').join("");
function pd(v){if(v instanceof Date)return v.toISOString().slice(0,10);v=String(v==null?"":v).trim();if(!v)return"";
if(/^\d{5}(\.\d+)?$/.test(v))return new Date(Math.round((+v-25569)*864e5)).toISOString().slice(0,10);
const m=v.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);if(m)return m[3]+"-"+("0"+m[2]).slice(-2)+"-"+("0"+m[1]).slice(-2);
return/^\d{4}-\d{2}-\d{2}/.test(v)?v.slice(0,10):""}
function cr(x){
 if(x.s==="Finalizado"||x.s==="Suspendido")return{k:"",t:""};
 if(!x.di||!x.d)return{k:"nd",t:"Sin fecha"};
 const f=new Date(x.di+"T00:00:00Z");f.setUTCDate(f.getUTCDate()+x.d);
 const d=dif(hoy(),f.toISOString().slice(0,10));
 return d<0?{k:"at",t:"Atrasado "+(-d)+" d"}:d<=30?{k:"pv",t:"Vence en "+d+" d"}:{k:"ok",t:"Faltan "+d+" d"};
}
const norm=x=>{x.t=x.t||inf(x.n);x.p=R2[x.p]?x.p:"Sin asignar";x.di=x.di||"";x.b=+x.b||0;x.ej=+x.ej||0;x.a=+x.a||0;x.d=+x.d||0;x.h=Array.isArray(x.h)?x.h:[];return x};
const log=(x,t)=>x.h.push({f:Date.now(),t});

function load(){
 try{const d=localStorage.getItem(KEY)||localStorage.getItem(OLD);if(d){const j=JSON.parse(d);if(Array.isArray(j))return j.map(norm)}}catch(e){ERR=true}
 return[]}
function save(){
 try{localStorage.setItem(KEY,JSON.stringify(P));LS=Date.now();ERR=false}catch(e){ERR=true}
 sync()}
function sync(){$("sy").innerHTML=ERR?'<i class="dot x"></i>No se pudo guardar: descarga un respaldo':'<i class="dot"></i>'+(LS?'Guardado '+new Date(LS).toLocaleTimeString("es-DO",{hour:"2-digit",minute:"2-digit"}):'Datos cargados')+' · '+P.length+' proyectos'}
function toast(m,e,undo){const t=$("ts");t.innerHTML=esc(m)+(undo?'<button id="un">Deshacer</button>':"");t.className="ts on"+(e?" er":"");
 if(undo)$("un").onclick=()=>{undo();t.className="ts"};clearTimeout(t._t);t._t=setTimeout(()=>t.className="ts",undo?6000:3500)}

function fill(){
 $("fr").innerHTML=opts(Object.keys(REG),"Todas las regiones");
 const g=Object.keys(REG).map(r=>'<optgroup label="'+r+'">'+opts(REG[r])+'</optgroup>').join("");
 $("fp").innerHTML='<option value="">Todas las provincias</option>'+g;$("p").innerHTML=g;
 $("ftp").innerHTML=opts(TP,"Todos los tipos");$("t").innerHTML=opts(TP);
 $("fs").innerHTML=opts(ST,"Todos los estatus");$("s").innerHTML=opts(ST);
 $("fz").innerHTML='<option value="">Todo el cronograma</option><option value="at">Atrasados</option><option value="pv">Vencen en 30 días</option><option value="nd">Sin fecha</option>';
}
function dn(it,ct,sub,f){
 const t=it.reduce((s,x)=>s+x.v,0),C=2*Math.PI*54;let o=0,s='<svg viewBox="0 0 140 140" width="150" height="150" role="img" aria-label="'+sub+'"><circle cx="70" cy="70" r="54" fill="none" stroke="var(--bar)" stroke-width="20"/>';
 if(!t)return'<div class="dw">'+s+'<text x="70" y="75" text-anchor="middle" font-size="15" font-weight="700" fill="var(--tx)">0</text></svg><div class="e">Sin datos</div></div>';
 it.forEach(x=>{const d=x.v/t*C;s+='<circle cx="70" cy="70" r="54" fill="none" stroke="'+x.c+'" stroke-width="20" stroke-dasharray="'+d+' '+(C-d)+'" stroke-dashoffset="'+(-o)+'" transform="rotate(-90 70 70)"/>';o+=d});
 s+='<text x="70" y="69" text-anchor="middle" font-size="14" font-weight="700" fill="var(--tx)">'+ct+'</text><text x="70" y="85" text-anchor="middle" font-size="9" fill="var(--mu)">'+sub+'</text></svg>';
 return'<div class="dw">'+s+'<div class="lz">'+it.map(x=>'<div class="lr"'+(x.p?' data-p="'+esc(x.p)+'"':'')+(x.t?' data-t="'+esc(x.t)+'"':'')+'><i style="background:'+x.c+'"></i><span>'+esc(x.l)+'</span><b>'+f(x.v)+'</b></div>').join("")+'</div></div>';
}
function dash(G,L){
 const ks=Object.keys(G).sort((a,b)=>G[b]-G[a]),T=ks.reduce((t,k)=>t+G[k],0),tp=ks.slice(0,5).map((k,i)=>({l:k,v:G[k],c:CT[i],p:k})),ot=T-tp.reduce((t,x)=>t+x.v,0),
 SC={"Planificación":"#d97706","En ejecución":"#1d4ed8","Finalizado":"#16a34a","Suspendido":"#dc2626"},tg={};
 if(ot>0)tp.push({l:"Otras provincias",v:ot,c:CT[10]});
 const sl=ST.map(s=>({l:s,v:L.filter(x=>x.s===s).length,c:SC[s]})).filter(x=>x.v>0);
 L.forEach(x=>tg[x.t]=(tg[x.t]||0)+1);
 const tl=Object.keys(tg).sort((a,b)=>tg[b]-tg[a]).map((k,i)=>({l:k,v:tg[k],c:CT[i%CT.length],t:k}));
 $("dn").innerHTML='<div class="c"><h3>Top 5 provincias por presupuesto</h3>'+dn(tp,T?(T/1e6).toFixed(1)+" M":"0","RD$",v=>(v/1e6).toFixed(1)+" M")+'</div><div class="c"><h3>Proyectos por tipo de obra</h3>'+dn(tl,L.length,"proyectos",v=>v)+'</div><div class="c"><h3>Proyectos por estatus</h3>'+dn(sl,L.length,"proyectos",v=>v)+'</div>';
}
function match(x,skipP){const t=nz([x.n,x.u,x.c,x.p,x.v,x.ct,x.o,x.t].join(" "));
 return(!F.q||t.indexOf(nz(F.q))>-1)&&(!F.r||R2[x.p]===F.r)&&(!F.s||x.s===F.s)&&(!F.t||x.t===F.t)&&(!F.z||cr(x).k===F.z)&&(skipP||!F.p||x.p===F.p)}

function render(){
 const sg=JSON.stringify(F);if(sg!==SG){SG=sg;PG=1}const L=P.filter(x=>match(x));
 const cols=[["c","SNIP"],["n","Proyecto"],["t","Tipo de obra"],["p","Provincia"],["b","Presupuesto"],["di","Inicio"],["d","Duración"],["a","Avance"],["v","Supervisor"],["s","Estatus"]];

 $("k").innerHTML=[["Proyectos mostrados",L.length+" de "+P.length,"folder"],["Presupuesto total",rd(inv),"building"],["Ejecutado",rd(ejc)+" ("+(inv?(ejc/inv*100).toFixed(0):0)+"%)","cash"],["Avance físico ponderado",av.toFixed(0)+"%","activity"],["Atrasados",at,"clock"]].map(k=>'<div class="c kc"><span class="ki">'+I(k[2])+'</span><span class="kt"><small>'+k[0]+'</small><b class="kv">'+k[1]+'</b></span></div>').join("");

 sync();
}

function detalle(id){
 const x=P.find(p=>p.id===id);if(!x)return;const z=cr(x),pf=x.b?Math.min(100,x.ej/x.b*100):0;
 $("dvb").innerHTML='<div style="display:flex;justify-content:space-between;gap:10px"><h3 style="margin:0">'+esc(x.n)+'</h3><span class="s '+x.s.replace(/ /g,"")+'">'+x.s+'</span></div><small style="color:var(--mu)">'+esc(x.p)+(x.u?" · "+esc(x.u):"")+(x.c?" · "+esc(x.c):"")+'</small>'
 +'<div class="dl"><div><small>Tipo de obra</small>'+esc(x.t)+'</div><div><small>Supervisor</small>'+esc(x.v||"—")+'</div><div><small>Contratista</small>'+esc(x.ct||"—")+'</div><div><small>Presupuesto</small>'+rd(x.b)+'</div><div><small>Inicio</small>'+fdt(x.di)+'</div><div><small>Duración</small>'+(x.d?fd(x.d):"—")+(z.t?' <span class="z '+z.k+'">'+z.t+'</span>':"")+'</div></div>'

 +'<small>Avance físico: '+x.a+'%</small><div class="bar"><i style="width:'+x.a+'%"></i></div><small style="display:block;margin-top:8px">Avance financiero: '+pf.toFixed(0)+'% ('+rd(x.ej)+')</small><div class="bar f2"><i style="width:'+pf+'%"></i></div>'
 +'<h4 style="margin:16px 0 4px">Bitácora</h4><div class="g2" style="grid-template-columns:1fr auto"><input id="nt" placeholder="Registrar una nota o novedad…"><button class="b" id="na" data-n="'+x.id+'">Agregar</button></div>'
 +'<ul class="hi">'+(x.h.slice().reverse().map(h=>'<li>'+esc(h.t)+'<small>'+fh(h.f)+'</small></li>').join("")||'<li style="color:var(--mu)">Sin registros.</li>')+'</ul>'
 +'<div class="ft"><button class="b" data-e="'+x.id+'">Editar</button><button class="b p" id="cv">Cerrar</button></div>';
 $("cv").onclick=()=>$("dv").close();$("dv").showModal();
}
function abrir(id){ed=id;const x=P.find(p=>p.id===id)||{n:"",p:F.p||"Distrito Nacional",u:"",c:"",b:"",ej:"",a:0,s:"Planificación",v:"",ct:"",o:"",t:F.t||TP[0],di:"",d:""};
 $("dt").textContent=id?"Editar proyecto":"Nuevo proyecto";
 const m={n:"n",p:"p",u:"u",c:"c",b:"b",ej:"ej",s:"s",t:"t",di:"di",d:"du",v:"sv",ct:"ct2",o:"ob",a:"a"};for(const k in m)$(m[k]).value=x[k]==null?"":x[k];
 $("av").textContent=x.a+"%";$("dg").showModal()}
$("a").oninput=function(){const v=+this.value,s=$("s");$("av").textContent=v+"%";if(v===100&&s.value!=="Suspendido")s.value="Finalizado";else if(v>0&&v<100&&s.value==="Planificación")s.value="En ejecución"};

$("fm").onsubmit=e=>{e.preventDefault();
 let a=+$("a").value,s=$("s").value;if(a===100&&s!=="Suspendido")s="Finalizado";if(s==="Finalizado")a=100;
 const b=+$("b").value||0,ej=+$("ej").value||0,c=$("c").value.trim(),old=P.find(x=>x.id===ed);
 if(ej>b)return toast("El monto ejecutado no puede superar el presupuesto.",1);
 const dup=c&&P.find(x=>x.c&&nz(x.c)===nz(c)&&x.id!==ed);if(dup)return toast("El código SNIP ya está en «"+dup.n+"».",1);
 const o=norm({id:ed||"p"+Date.now(),n:$("n").value.trim(),p:$("p").value,u:$("u").value.trim(),c,t:$("t").value,b,ej,a,s,di:$("di").value,d:+$("du").value||0,v:$("sv").value.trim(),ct:$("ct2").value.trim(),o:$("ob").value.trim(),h:old?old.h:[]});
 if(!old)log(o,"Proyecto registrado con estatus «"+s+"»");else{
  if(old.s!==s)log(o,"Estatus: "+old.s+" → "+s);if(old.a!==a)log(o,"Avance físico: "+old.a+"% → "+a+"%");
  if(old.b!==b)log(o,"Presupuesto: "+rd(old.b)+" → "+rd(b));if(old.ej!==ej)log(o,"Monto ejecutado: "+rd(old.ej)+" → "+rd(ej))}
 P=old?P.map(x=>x.id===o.id?o:x):P.concat([o]);save();render();$("dg").close();$("dv").close();toast(old?"Proyecto actualizado":"Proyecto creado")};

document.addEventListener("click",e=>{
 if(!e.target.closest(".dm"))$("dm").open=false;
 const t=e.target.closest("[data-p],[data-t],[data-k],[data-e],[data-d],[data-g],[data-v],[data-n]");if(!t)return;const d=t.dataset;
 if(d.v)return detalle(d.v);

 if(d.p!==undefined){F.p=F.p===d.p?"":d.p;$("fp").value=F.p}
 else if(d.t!==undefined){F.t=F.t===d.t?"":d.t;$("ftp").value=F.t}
 else if(d.k){sd=sk===d.k?-sd:1;sk=d.k}
 else if(d.g)PG+=+d.g;

 else if(d.d){const i=P.findIndex(p=>p.id===d.d),x=P[i];if(!x||!confirm("¿Eliminar «"+x.n+"»?"))return;P.splice(i,1);save();render();return toast("Proyecto eliminado",0,()=>{P.splice(i,0,x);save();render()})}
 render()});

$("xp").onclick=()=>{if(!window.XLSX)return toast("No se pudo cargar el generador de Excel.",1);
 const rows=P.filter(x=>match(x)).map(x=>({"Región":R2[x.p]||"","Provincia":x.p,"Nombre del Proyecto":x.n,"Ubicación":x.u||"","Código SNIP":x.c||"","Tipo de obra":x.t,"Presupuesto (RD$)":x.b,"Ejecutado (RD$)":x.ej,"Fecha de inicio":x.di?fdt(x.di):"","Duración (días)":x.d||"","% Avance":x.a,"Estatus":x.s,"Supervisor":x.v||"","Contratista":x.ct||"","Observación":x.o||""}));
 if(!rows.length)return toast("No hay proyectos para exportar.",1);
 const w=XLSX.utils.book_new();XLSX.utils.book_append_sheet(w,XLSX.utils.json_to_sheet(rows),"Proyectos");XLSX.writeFile(w,"Proyectos_"+hoy()+".xlsx");toast("Exportados "+rows.length+" proyectos")};

$("rs").onclick=()=>{$("fj").value="";$("fj").click()};
$("fj").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result),a=Array.isArray(j)?j:j.proyectos;if(!Array.isArray(a))throw 0;
 if(!confirm("Esto reemplazará los "+P.length+" proyectos actuales por los "+a.length+" del respaldo. ¿Continuar?"))return;P=a.map(norm);save();render();toast("Respaldo restaurado: "+a.length+" proyectos")}catch(x){toast("El archivo no es un respaldo válido.",1)}};r.readAsText(f)};

$("im").onclick=()=>{$("fi").value="";$("fi").click()};
$("fi").onchange=e=>{const f=e.target.files[0];if(!f)return;if(!window.XLSX)return toast("La librería de Excel no cargó. Revisa tu conexión.",1);
 $("ld").style.display="flex";const fr=new FileReader();
 fr.onerror=()=>{$("ld").style.display="none";toast("No se pudo leer el archivo.",1)};
 fr.onload=ev=>setTimeout(()=>{try{
  const wb=XLSX.read(new Uint8Array(ev.target.result),{type:"array"}),add=[];let skipped=0,seen=0;
  wb.SheetNames.forEach(sn=>{
   const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:""}),fin=/inaugur|finaliz|ejecutad|terminad/.test(nz(sn));let hi=-1,M={},best=1;
   const hm=row=>{const m={};row.forEach((c,j)=>{c=nz(c);if(!c||c.length>40)return;if(/proyecto|obra|nombre/.test(c)&&m.n==null)m.n=j;else if(/monto|presupuesto|costo|valor/.test(c)&&m.b==null)m.b=j;else if(/etapa|estatus|estado/.test(c)&&m.e==null)m.e=j;else if(/sector|tipo/.test(c)&&m.t==null)m.t=j;else if(/inicio|fecha/.test(c)&&m.di==null)m.di=j;else if(/snip|codigo/.test(c)&&m.c==null)m.c=j;else if(/duracion|tiempo/.test(c)&&m.d==null)m.d=j;else if(/supervisor|responsable/.test(c)&&m.v==null)m.v=j;else if(/contratista/.test(c)&&m.ct==null)m.ct=j;else if(/avance/.test(c)&&m.a==null)m.a=j});return m};
   for(let i=0;i<Math.min(rows.length,30);i++){const m=hm(rows[i]),n=Object.keys(m).length;if(n>best){best=n;hi=i;M=m}}
   if(!rows.length)return;seen+=rows.length;
   let prov="Sin asignar";const g=(r,k)=>M[k]!=null?String(r[M[k]]).trim():"";
   for(let j=hi+1;j<rows.length;j++){const r=rows[j],ne=r.filter(c=>String(c).trim()!==""),first=ne.length?nz(ne[0]):"";
    if(!ne.length)continue;
    if(ne.length===1||/^provincia\b/.test(first)){const pv=cleanProv(String(ne[0]));if(ne.length===1&&pv==="Sin asignar"&&!/^provincia/.test(first))continue;prov=pv;if(ne.length===1)continue}
    let n=g(r,"n");if(n.length<4||!isNaN(+n.replace(/,/g,""))){n="";for(const c of r){const v=String(c).trim();if(v.length>5&&isNaN(+v.replace(/,/g,""))&&!/provincia|listado/.test(nz(v))){n=v;break}}}
    if(n.length<4||/^total|^subtotal|^no\.?$/.test(nz(n)))continue;
    let b=parseFloat(g(r,"b").replace(/[^0-9.\-]/g,""));if(isNaN(b)){b=0;if(M.b==null)for(const c of r){const v=parseFloat(String(c).replace(/,/g,""));if(!isNaN(v)&&v>10000){b=v;break}}}
    const et=nz(g(r,"e")),du=nz(g(r,"d")).match(/(\d+)\s*(ano|mes|dia)/);let s="Planificación",a=0;
    if(fin||/inaugur|finaliz|ejecutado|terminad|conclu/.test(et)){s="Finalizado";a=100}else if(/suspend|deten|paraliz|no tiene/.test(et))s="Suspendido";else if(/ejecuc|proceso|construc/.test(et))s="En ejecución";
    const av=parseFloat(g(r,"a").replace(/[^0-9.]/g,""));if(!isNaN(av)&&s!=="Finalizado")a=Math.min(100,av<=1&&/%/.test(g(r,"a"))===false&&av>0&&av<=1?av*100:av);
    const o=norm({id:"p"+Date.now()+"_"+add.length,n,p:prov,c:g(r,"c"),t:g(r,"t")?inf(g(r,"t")):inf(n),b,a,s,di:M.di!=null?pd(r[M.di]):"",d:du?+du[1]*(du[2]==="ano"?365:du[2]==="mes"?30:1):0,v:g(r,"v"),ct:g(r,"ct"),o:et?"Etapa en Excel: "+et:"",h:[]});
    log(o,"Importado desde «"+f.name+"» (hoja "+sn+")");add.push(o)}});
  $("ld").style.display="none";
  const key=x=>x.c?"c:"+nz(x.c):"n:"+nz(x.n)+"|"+x.p,have=new Set(P.map(key)),nuevos=add.filter(x=>{const k=key(x);if(have.has(k))return false;have.add(k);return true});
  if(!add.length)return toast("No se encontraron proyectos ("+wb.SheetNames.length+" hojas, "+seen+" filas leídas). Revisa que el Excel tenga los nombres de las obras en texto.",1);
  P=P.concat(nuevos);save();render();toast("Importados "+nuevos.length+" proyectos nuevos"+(add.length-nuevos.length?" · "+(add.length-nuevos.length)+" duplicados omitidos":"")+(skipped?" · "+skipped+" hoja(s) sin encabezado":""))
 }catch(err){$("ld").style.display="none";toast("Error al leer el Excel: "+err.message,1)}},60);
 fr.readAsArrayBuffer(f)};

fill();document.querySelectorAll("[data-i]").forEach(el=>el.insertAdjacentHTML("afterbegin",I(el.dataset.i)));
P=load();render();
